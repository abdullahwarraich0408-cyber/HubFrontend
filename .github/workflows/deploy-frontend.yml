name: Deploy Frontend to VPS
on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - 'AdminPanel/**'
      - 'DoctorPanel/**'
      - 'LabPanel/**'
      - 'VendorPanel/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Build all 5 panels IN PARALLEL
  # ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        panel:
          - { name: Frontend,     dir: Frontend }
          - { name: AdminPanel,   dir: AdminPanel }
          - { name: DoctorPanel,  dir: DoctorPanel }
          - { name: LabPanel,     dir: LabPanel }
          - { name: VendorPanel,  dir: VendorPanel }
    env:
      NODE_OPTIONS: ""
      NEXT_PUBLIC_API_URL: https://medmarket.asrar.dev/api
      BACKEND_URL: https://medmarket.asrar.dev
      NEXT_PUBLIC_ENABLE_TEST_AUTH: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCh_rJUG6PHgRl9TbFwoThqTxC3EZSp1G0
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: medcare-a5507.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: medcare-a5507
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: medcare-a5507.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "546088011555"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:546088011555:web:0cdb888476b859916f2e96
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.panel.dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ./${{ matrix.panel.dir }}
        run: npm ci

      - name: Build
        working-directory: ./${{ matrix.panel.dir }}
        run: npm run build

      - name: Package build artifact
        run: |
          tar -czf ${{ matrix.panel.name }}.tar.gz \
            -C ${{ matrix.panel.dir }} \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.mjs \
            node_modules

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.panel.name }}
          path: ${{ matrix.panel.name }}.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────
  # 2. Deploy – runs only after ALL builds pass
  # ──────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create deployment bundle
        run: |
          mkdir -p deploy
          for panel in Frontend AdminPanel DoctorPanel LabPanel VendorPanel; do
            mkdir -p deploy/$panel
            tar -xzf artifacts/$panel/$panel.tar.gz -C deploy/$panel
          done
          tar -czf deploy-bundle.tar.gz -C deploy .

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo rm -rf ${{ secrets.VPS_PROJECT_PATH }}
            sudo mkdir -p ${{ secrets.VPS_PROJECT_PATH }}
            sudo chown -R $USER:$USER ${{ secrets.VPS_PROJECT_PATH }}

      - name: Copy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy-bundle.tar.gz"
          target: "${{ secrets.VPS_PROJECT_PATH }}"

      - name: Extract and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            tar -xzf deploy-bundle.tar.gz
            rm deploy-bundle.tar.gz

            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true

            declare -A PANELS
            PANELS=(
              ["Frontend"]="3000"
              ["AdminPanel"]="3001"
              ["DoctorPanel"]="3002"
              ["LabPanel"]="3003"
              ["VendorPanel"]="3004"
            )

            for PANEL in "${!PANELS[@]}"; do
              PORT=${PANELS[$PANEL]}
              APP_NAME=$(echo "$PANEL" | tr '[:upper:]' '[:lower:]')

              echo "Starting $PANEL on port $PORT..."
              cd ${{ secrets.VPS_PROJECT_PATH }}/$PANEL

              pm2 describe $APP_NAME > /dev/null 2>&1
              if [ $? -eq 0 ]; then
                pm2 restart $APP_NAME
              else
                pm2 start npm --name "$APP_NAME" -- run start -- -p $PORT
              fi
            done

            pm2 save
