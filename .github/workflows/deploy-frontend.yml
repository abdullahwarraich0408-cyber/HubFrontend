name: Deploy Frontend to VPS
on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - 'AdminPanel/**'
      - 'DoctorPanel/**'
      - 'LabPanel/**'
      - 'VendorPanel/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Build all 5 panels IN PARALLEL
  # ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        panel:
          - { name: Frontend,     dir: Frontend }
          - { name: AdminPanel,   dir: AdminPanel }
          - { name: DoctorPanel,  dir: DoctorPanel }
          - { name: LabPanel,     dir: LabPanel }
          - { name: VendorPanel,  dir: VendorPanel }
    env:
      NODE_OPTIONS: ""
      NEXT_PUBLIC_API_URL: https://backend.medzoos.com/api
      BACKEND_URL: https://backend.medzoos.com
      NEXT_PUBLIC_ENABLE_TEST_AUTH: "true"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1083815277954-9spbmn6ppfe4nnb3eong8dbihn44211a.apps.googleusercontent.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.panel.dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ./${{ matrix.panel.dir }}
        run: npm ci

      - name: Build
        working-directory: ./${{ matrix.panel.dir }}
        run: npm run build

      - name: Package build artifact
        run: |
          tar -czf ${{ matrix.panel.name }}.tar.gz \
            -C ${{ matrix.panel.dir }} \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.mjs \
            node_modules

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.panel.name }}
          path: ${{ matrix.panel.name }}.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────
  # 2. Deploy – runs only after ALL builds pass
  # ──────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create deployment bundle
        run: |
          mkdir -p deploy
          for panel in Frontend AdminPanel DoctorPanel LabPanel VendorPanel; do
            mkdir -p deploy/$panel
            tar -xzf artifacts/$panel/$panel.tar.gz -C deploy/$panel
          done
          tar -czf deploy-bundle.tar.gz -C deploy .

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            DEPLOY_DIR="${{ secrets.VPS_PROJECT_PATH }}"
            mkdir -p "$DEPLOY_DIR"
            rm -rf "$DEPLOY_DIR"/*

      - name: Copy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy-bundle.tar.gz"
          target: "${{ secrets.VPS_PROJECT_PATH }}"

      - name: Extract and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Load nvm and ensure Node 20 is available
            export NVM_DIR="$HOME/.nvm"
            if [ ! -d "$NVM_DIR" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
            fi
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20
            nvm alias default 20

            # Get the actual node binary path for PM2
            NODE_PATH=$(which node)
            echo "Using Node: $NODE_PATH ($(node -v))"

            # Ensure pm2 is available with this Node version
            npm list -g pm2 || npm install -g pm2

            cd ${{ secrets.VPS_PROJECT_PATH }}
            tar -xzf deploy-bundle.tar.gz
            rm deploy-bundle.tar.gz

            # Stop all existing crash-looping processes
            pm2 delete all 2>/dev/null || true

            declare -A PANELS
            PANELS=(
              ["Frontend"]="3000"
              ["AdminPanel"]="3001"
              ["DoctorPanel"]="3002"
              ["LabPanel"]="3003"
              ["VendorPanel"]="3004"
            )

            for PANEL in "${!PANELS[@]}"; do
              PORT=${PANELS[$PANEL]}
              APP_NAME=$(echo "$PANEL" | tr '[:upper:]' '[:lower:]')

              echo "Starting $PANEL on port $PORT with Node $(node -v)..."
              cd ${{ secrets.VPS_PROJECT_PATH }}/$PANEL

              pm2 start npm --name "$APP_NAME" --interpreter "$NODE_PATH" -- run start -- -p $PORT
            done

            pm2 save
